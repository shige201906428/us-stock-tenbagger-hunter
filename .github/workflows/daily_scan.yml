name: Tenbagger Hunter Daily Scan

on:
  schedule:
    - cron: '0 21 * * *' # 日本時間 6:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # ここで必要なライブラリをすべて強制インストールします
        run: pip install yfinance pandas lxml html5lib
        
      - name: Run Screener
        run: python scripts/screener.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update: 1000 stocks scanned and updated HTML" || exit 0
          git push
