name: Tenbagger Hunter Daily Scan
on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 (日本時間 7:00)
  workflow_dispatch: # 手動実行ボタンも作成

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Screener
        run: python scripts/screener.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.csv
          git commit -m "Auto-update: Found potential tenbaggers" || exit 0
          git push
